# Rohlik Decision Hub — default localhost configuration.
# S04 LAN mode is an explicit CLI override in scripts/start_streamlit_lan.ps1.

[server]
address = "127.0.0.1"
port = 8501
headless = true
maxUploadSize = 25
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
