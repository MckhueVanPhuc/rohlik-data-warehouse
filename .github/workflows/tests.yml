name: Synthetic tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/v4-03-landing-ingestion
      - feat/v4-05-pipeline

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]      # D08: hỗ trợ Mac chính thức
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: OpenMP for LightGBM (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-models.txt
      - name: Run synthetic suite
        run: python -m pytest -q
